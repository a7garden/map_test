      키는 하드코딩 (Phase 1, 로컬 First). 운영 시에는 도메인 제한과 함께 환경변수로 옮길 것.
    -->

      type="text/javascript"
      src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5be0a34292474922b240a1bd76ad518c&autoload=false&libraries=services,clusterer,drawing"
    ></script>
